# Markdownlint config for the generator project itself
# See https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Ignore output folder and generated files
ignores:
  - "output/**"
  - "**/output/**"

# Rules
config:
  # Headers
  MD001: true
  MD002: true
  MD022: false

  # Code blocks
  MD031: false
  MD040: false

  # Links
  MD042: true
  MD043: false
  MD051: false

  # Lists
  MD005: false
  MD007: false
  MD032: false

  # Tables
  MD058: false
  MD060: false

  # Spacing
  MD012: true
  MD047: true

  # Line length - disabled (examples, tables, URLs)
  MD013: false
